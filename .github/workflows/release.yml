name: Release Tabulas Card Hub

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package clean release zip and SHA256SUMS.txt
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import fnmatch
          import os
          import zipfile
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          zip_name = f"tabulas-hub-{tag}.zip"
          excluded_dirs = {
              ".git",
              ".github",
              ".agents",
              "Data",
              "Cache",
              "Logs",
              "Set Library",
              "Archive",
              "Batches",
              "downloaded_files",
              "__pycache__",
              "node_modules",
          }
          excluded_globs = ("*.log", "*.lock")
          skip_files = {zip_name, "SHA256SUMS.txt", "RELEASE_NOTES.md"}

          root = Path(".").resolve()
          files_to_pack = []
          for dirpath, dirnames, filenames in os.walk(root):
              dirnames[:] = sorted(d for d in dirnames if d not in excluded_dirs)
              for fname in sorted(filenames):
                  if fname in skip_files:
                      continue
                  if any(fnmatch.fnmatch(fname, pat) for pat in excluded_globs):
                      continue
                  full_path = Path(dirpath) / fname
                  rel_posix = full_path.relative_to(root).as_posix()
                  files_to_pack.append((full_path, rel_posix))

          with zipfile.ZipFile(zip_name, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for full_path, rel_posix in files_to_pack:
                  zf.write(full_path, arcname=rel_posix)
          print(f"Packaged {len(files_to_pack)} files into {zip_name}")
          PY
          sha256sum "tabulas-hub-${{ github.ref_name }}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate user-facing release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ["TAG_NAME"].strip()
          clean_ver = tag.lstrip("vV")
          out_path = Path("RELEASE_NOTES.md")

          def _extract_from_changelog(md_path: Path, target_ver: str) -> str:
              if not md_path.exists():
                  return ""
              text = md_path.read_text(encoding="utf-8-sig", errors="replace").replace("\r\n", "\n")
              heading_re = re.compile(r"^##\s+\[?v?([0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.]+)?)\]?(?:\s*[—–-].*)?$", re.MULTILINE)
              matches = list(heading_re.finditer(text))
              for idx, m in enumerate(matches):
                  ver = m.group(1).strip().lstrip("vV")
                  if ver.lower() == target_ver.lower():
                      start = m.end()
                      end = matches[idx + 1].start() if idx + 1 < len(matches) else len(text)
                      body = text[start:end].strip()
                      # Remove trailing horizontal rule separators
                      body = re.sub(r"\n+---\s*$", "", body).strip()
                      return body
              return ""

          def _fallback_from_git(target_tag: str) -> str:
              prev_tag = ""
              try:
                  res_prev = subprocess.run(
                      ["git", "describe", "--tags", "--abbrev=0", f"{target_tag}^"],
                      capture_output=True, text=True, check=False,
                  )
                  if res_prev.returncode == 0:
                      prev_tag = res_prev.stdout.strip()
              except Exception:
                  prev_tag = ""

              rev_range = f"{prev_tag}..{target_tag}" if prev_tag else target_tag
              res_log = subprocess.run(
                  ["git", "log", rev_range, "--no-merges", "--pretty=format:%s"],
                  capture_output=True, text=True, check=False,
              )
              subjects = [ln.strip() for ln in (res_log.stdout or "").splitlines() if ln.strip()]
              if not subjects:
                  return f"### Features & Improvements\n- Release `{target_tag}` of Tabulas Card Hub."

              features, ui_workflow, fixes = [], [], []
              for subj in subjects:
                  cleaned = re.sub(
                      r"^(?:Sandbox\s+(?:Wave\s+\w+|Audit\s+Wave\s+\d+|Track\s+\w+(?:\s+\w+)?|v[0-9.]+)|Antigravity\s+Batch\s+\d+|v[0-9.\-a-z]+)\s*:\s*",
                      "",
                      subj,
                      flags=re.IGNORECASE,
                  ).strip()
                  low = cleaned.lower()
                  if any(k in low for k in ("fix", "bug", "guard", "prevent", "resolve", "leak", "crash", "error", "hardening")):
                      fixes.append(cleaned)
                  elif any(k in low for k in ("ui", "theme", "skin", "dashboard", "navigation", "toast", "notification", "collapsible", "layout", "viewer", "loupe", "gauge")):
                      ui_workflow.append(cleaned)
                  else:
                      features.append(cleaned)

              parts = []
              if features:
                  parts.append("### Features & Improvements\n" + "\n".join(f"- {item}" for item in features))
              if ui_workflow:
                  parts.append("### UI & Workflow\n" + "\n".join(f"- {item}" for item in ui_workflow))
              if fixes:
                  parts.append("### Bug Fixes\n" + "\n".join(f"- {item}" for item in fixes))
              return "\n\n".join(parts)

          notes = _extract_from_changelog(Path("CHANGELOG.md"), clean_ver)
          if not notes:
              notes = _fallback_from_git(tag)
          out_path.write_text(notes.strip() + "\n", encoding="utf-8")
          print(f"Wrote RELEASE_NOTES.md ({len(notes)} chars) for {tag}")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            tabulas-hub-${{ github.ref_name }}.zip
            SHA256SUMS.txt
